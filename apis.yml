name: Numina
description: >-
  Numina is a New York City-based urban street-intelligence company (founded 2014,
  backed by 500 Global and SOSV) whose privacy-first, edge-processing computer-vision
  sensors measure how people, bicycles, and vehicles move through the public
  right-of-way. Its "Know Your Streets" platform turns anonymous, aggregated
  activity into multimodal mobility data for urban planners, municipal departments
  of transportation, and facilities managers, and exposes that data through the
  Numina Graph GraphQL API and a developer sandbox. (This profile was seeded as a
  500 Global portfolio stub under the placeholder label "CTY"; its Website pointer
  and 500 Global backing identify it as Numina / numina.co.)
