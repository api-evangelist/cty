apis:
- name: Numina Graph API
  description: >-
    The Numina Graph API ("Numina-Graph") is a GraphQL API, authenticated with JWT
    bearer tokens, that exposes Numina's anonymous, aggregated street-activity data.
    Core objects include Device (a Numina sensor identified by a unique serial number)
    and Behavior Zone (a user-defined polygon used as a spatial filter for analytics).
    Queries filter multimodal traffic volumes spatially and temporally and return
    pre-computed visualizations. A developer sandbox provides ten days of real data
    from the Downtown Brooklyn (Fulton Mall) deployment.
  humanURL: https://developer.numina.co/
  baseURL: https://api.numina.co
